name = "hex-sparse-poly-conformance"
defaultTargets = ["HexSparsePolyConformance"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexSparsePoly"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "36e7d67fc3a511ca9d69f360def6e50769e439d4"

[[require]]
name = "HexModArith"
git = "https://github.com/leanprover/hex-mod-arith.git"
rev = "a73a04b66be68d605a7a92f6cfdcfc6c727fda0f"

[[lean_lib]]
name = "HexSparsePolyConformance"
globs = [
  "HexSparsePolyFixtures",
  "HexSparsePoly.Conformance",
]

[[lean_exe]]
name = "hexsparsepoly_emit_fixtures"
root = "HexSparsePoly.EmitFixtures"
