name = "hex-sparse-poly"
defaultTargets = ["HexSparsePoly"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "6ad58796dca6bae4936003412816e4e844055558"

[[require]]
name = "HexPoly"
git = "https://github.com/leanprover/hex-poly.git"
rev = "eb264f4de2116244183510e7e21376f57b2a1c86"

[[lean_lib]]
name = "HexSparsePoly"
globs = [
  "HexSparsePoly",
  "HexSparsePoly.Basic",
  "HexSparsePoly.Arith",
  "HexSparsePoly.Dense",
  "HexSparsePoly.Eval",
  "HexSparsePoly.Euclid",
]

[[lean_lib]]
name = "HexSparsePolyTests"
globs = ["HexSparsePoly.KernelTests"]
